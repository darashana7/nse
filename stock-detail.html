<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Stock Detail Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#007AFF", // Updated to match iOS-style blue
              "background-light": "#F8F9FA",
              "background-dark": "#000000",
              "container-light": "#ffffff",
              "container-dark": "#1C1C1E",
              "text-primary-light": "#1D2329",
              "text-primary-dark": "#F2F2F7",
              "text-secondary-light": "#6B7280",
              "text-secondary-dark": "#8E8E93",
              "positive": "#34C759",
              "negative": "#FF3B30",
            },
            fontFamily: {
              display: ["Manrope", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.5rem", // Adjusted for a slightly softer iOS feel
              lg: "0.75rem",
              xl: "1rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative mx-auto flex h-auto min-h-screen w-full max-w-md flex-col overflow-x-hidden">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 flex items-center bg-background-light/80 px-4 py-3 backdrop-blur-sm dark:bg-background-dark/80">
    <a href="index.html" class="flex w-12 items-center justify-start">
<button class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full text-primary">
<span class="material-symbols-outlined text-3xl"> arrow_back_ios_new </span>
</button>
</a>
<div class="flex flex-1 flex-col items-center text-center">
<h1 class="text-base font-bold leading-tight tracking-tight text-text-primary-light dark:text-text-primary-dark">AAPL</h1>
<p class="text-xs font-medium text-text-secondary-light dark:text-text-secondary-dark">Apple Inc.</p>
</div>
<div class="flex w-12 items-center justify-end">
<button class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full text-primary">
<span class="material-symbols-outlined text-2xl"> more_horiz </span>
</button>
</div>
</header>
<main class="flex-1 px-4 pt-4 pb-32">
<!-- Header Section -->
<section>
<h2 class="text-4xl font-bold leading-tight tracking-tight text-text-primary-light dark:text-text-primary-dark">$172.50</h2>
<p class="pt-1 text-base font-medium leading-normal text-positive">+$2.50 (+1.25%) Today</p>
</section>
<!-- Chart Section -->
<section class="mt-6">
<!-- Chart -->
<div class="flex min-h-[200px] flex-1 flex-col">
<svg fill="none" height="100%" preserveaspectratio="none" viewbox="0 0 472 150" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient gradientunits="userSpaceOnUse" id="chartGradient" x1="236" x2="236" y1="1" y2="149">
<stop stop-color="#34C759" stop-opacity="0.2"></stop>
<stop offset="1" stop-color="#34C759" stop-opacity="0"></stop>
</lineargradient>
</defs>
<path d="M0 109C18.1538 109 18.1538 21 36.3077 21C54.4615 21 54.4615 41 72.6154 41C90.7692 41 90.7692 93 108.923 93C127.077 93 127.077 33 145.231 33C163.385 33 163.385 101 181.538 101C199.692 101 199.692 61 217.846 61C236 61 236 45 254.154 45C272.308 45 272.308 121 290.462 121C308.615 121 308.615 149 326.769 149C344.923 149 344.923 1 363.077 1C381.231 1 381.231 81 399.385 81C417.538 81 417.538 129 435.692 129C453.846 129 453.846 25 472 25V149H0V109Z" fill="url(#chartGradient)"></path>
<path d="M0 109C18.1538 109 18.1538 21 36.3077 21C54.4615 21 54.4615 41 72.6154 41C90.7692 41 90.7692 93 108.923 93C127.077 93 127.077 33 145.231 33C163.385 33 163.385 101 181.538 101C199.692 101 199.692 61 217.846 61C236 61 236 45 254.154 45C272.308 45 272.308 121 290.462 121C308.615 121 308.615 149 326.769 149C344.923 149 344.923 1 363.077 1C381.231 1 381.231 81 399.385 81C417.538 81 417.538 129 435.692 129C453.846 129 453.846 25 472 25" stroke="#34C759" stroke-linecap="round" stroke-width="2"></path>
</svg>
</div>
<!-- Timeframe Selector -->
<div class="mt-4 flex h-9 flex-1 items-center justify-center rounded-lg bg-gray-200 p-1 dark:bg-gray-800">
<label class="flex h-full flex-1 cursor-pointer items-center justify-center rounded-md bg-white text-xs font-semibold text-text-primary-light shadow-sm dark:bg-gray-600 dark:text-text-primary-dark">
<span class="truncate">1D</span> <input checked="" class="sr-only" name="timeframe" type="radio" value="1D"/>
</label>
<label class="flex h-full flex-1 cursor-pointer items-center justify-center rounded-md text-xs font-medium text-text-secondary-light dark:text-text-secondary-dark">
<span class="truncate">5D</span> <input class="sr-only" name="timeframe" type="radio" value="5D"/>
</label>
<label class="flex h-full flex-1 cursor-pointer items-center justify-center rounded-md text-xs font-medium text-text-secondary-light dark:text-text-secondary-dark">
<span class="truncate">1M</span> <input class="sr-only" name="timeframe" type="radio" value="1M"/>
</label>
<label class="flex h-full flex-1 cursor-pointer items-center justify-center rounded-md text-xs font-medium text-text-secondary-light dark:text-text-secondary-dark">
<span class="truncate">6M</span> <input class="sr-only" name="timeframe" type="radio" value="6M"/>
</label>
<label class="flex h-full flex-1 cursor-pointer items-center justify-center rounded-md text-xs font-medium text-text-secondary-light dark:text-text-secondary-dark">
<span class="truncate">1Y</span> <input class="sr-only" name="timeframe" type="radio" value="1Y"/>
</label>
<label class="flex h-full flex-1 cursor-pointer items-center justify-center rounded-md text-xs font-medium text-text-secondary-light dark:text-text-secondary-dark">
<span class="truncate">Max</span> <input class="sr-only" name="timeframe" type="radio" value="Max"/>
</label>
</div>
</section>
<!-- Key Metrics Section -->
<section class="mt-8">
<div class="grid grid-cols-2 gap-x-4 gap-y-5">
<div class="flex flex-col border-b border-gray-200 pb-2 dark:border-gray-800">
<p class="text-sm text-text-secondary-light dark:text-text-secondary-dark">Open</p>
<p class="mt-1 font-semibold text-text-primary-light dark:text-text-primary-dark">170.15</p>
</div>
<div class="flex flex-col border-b border-gray-200 pb-2 dark:border-gray-800">
<p class="text-sm text-text-secondary-light dark:text-text-secondary-dark">Market Cap</p>
<p class="mt-1 font-semibold text-text-primary-light dark:text-text-primary-dark">2.66T</p>
</div>
<div class="flex flex-col border-b border-gray-200 pb-2 dark:border-gray-800">
<p class="text-sm text-text-secondary-light dark:text-text-secondary-dark">52-Week High</p>
<p class="mt-1 font-semibold text-text-primary-light dark:text-text-primary-dark">198.23</p>
</div>
<div class="flex flex-col border-b border-gray-200 pb-2 dark:border-gray-800">
<p class="text-sm text-text-secondary-light dark:text-text-secondary-dark">P/E Ratio</p>
<p class="mt-1 font-semibold text-text-primary-light dark:text-text-primary-dark">28.93</p>
</div>
<div class="flex flex-col border-b border-gray-200 pb-2 dark:border-gray-800">
<p class="text-sm text-text-secondary-light dark:text-text-secondary-dark">52-Week Low</p>
<p class="mt-1 font-semibold text-text-primary-light dark:text-text-primary-dark">124.17</p>
</div>
<div class="flex flex-col border-b border-gray-200 pb-2 dark:border-gray-800">
<p class="text-sm text-text-secondary-light dark:text-text-secondary-dark">Dividend Yield</p>
<p class="mt-1 font-semibold text-text-primary-light dark:text-text-primary-dark">0.56%</p>
</div>
</div>
</section>
</main>
<!-- Action Buttons Footer -->
<footer class="fixed bottom-0 left-0 right-0 z-10 mx-auto max-w-md bg-background-light/80 p-4 backdrop-blur-sm dark:bg-background-dark/80">
<div class="flex items-center gap-3">
    <a href="add-stock.html" class="flex h-12 flex-1 items-center justify-center rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined mr-2 text-xl"> add </span>
<span class="text-base font-semibold">Add to Watchlist</span>
</a>
    <a href="create-alert.html" class="flex h-12 flex-1 items-center justify-center rounded-full bg-primary text-white">
<span class="material-symbols-outlined mr-2 text-xl"> notifications </span>
<span class="text-base font-semibold">Set Alert</span>
</a>
</div>
</footer>
</div>
<script src="script.js"></script>
</body></html>
