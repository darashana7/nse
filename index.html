<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Watchlist Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative min-h-screen w-full">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10 border-b border-gray-200/10 dark:border-gray-800">
<div class="text-gray-800 dark:text-white flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-3xl">menu</span>
</div>
<h1 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Watchlists</h1>
<div class="flex w-12 items-center justify-end">
    <button id="refresh-button" class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 w-10 bg-transparent text-gray-800 dark:text-white gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0">
        <span class="material-symbols-outlined text-3xl">refresh</span>
    </button>
</div>
</div>
<!-- Search Bar -->
<div class="px-4 py-3 bg-background-light dark:bg-background-dark">
    <div class="relative">
        <label class="flex flex-col min-w-40 h-12 w-full">
            <div class="flex w-full flex-1 items-stretch rounded-xl h-full shadow-sm">
                <div class="text-gray-400 dark:text-[#92adc9] flex border-gray-200 dark:border-gray-700 bg-white dark:bg-[#233648] items-center justify-center pl-4 rounded-l-xl border-r-0">
                    <span class="material-symbols-outlined">search</span>
                </div>
                <input id="search-input" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-r-xl text-gray-900 dark:text-white focus:outline-0 focus:ring-0 border-gray-200 dark:border-gray-700 bg-white dark:bg-[#233648] focus:border-primary h-full placeholder:text-gray-400 dark:placeholder:text-[#92adc9] px-4 pl-2 text-base font-normal leading-normal" placeholder="Search for a stock" value=""/>
            </div>
        </label>
        <button id="clear-search-button" class="absolute inset-y-0 right-0 flex items-center pr-3" style="display: none;">
            <span class="material-symbols-outlined text-gray-400 dark:text-[#92adc9]">close</span>
        </button>
    </div>
</div>
<main class="flex flex-col gap-6 p-4 pb-28">
    <div id="watchlist-container">
        <!-- Stock data will be dynamically injected here -->
    </div>
    <div class="text-center text-sm text-gray-500 dark:text-gray-400">
        Last updated: <span id="last-updated"></span>
    </div>
</main>
<!-- Floating Action Button (FAB) -->
<div class="fixed bottom-6 right-6">
    <a href="add-stock.html" class="flex items-center justify-center size-14 bg-primary text-white rounded-full shadow-lg shadow-primary/40">
<span class="material-symbols-outlined text-3xl">add</span>
</a>
</div>
</div>
<script src="script.js"></script>
</body></html>
