<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create New Alert</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00C853",
            "background-light": "#F7F7F7",
            "background-dark": "#121212",
            "surface-light": "#FFFFFF",
            "surface-dark": "#1C1C1E",
            "text-light": "#1C1C1E",
            "text-dark": "#EAEAEA",
            "text-secondary-light": "#636366",
            "text-secondary-dark": "#8E8E93",
            "border-light": "#E5E5E5",
            "border-dark": "#38383A",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<div class="flex flex-col h-full">
<!-- TopAppBar -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10 border-b border-border-light dark:border-border-dark">
    <a id="back-button" href="#" class="flex size-10 shrink-0 items-center justify-center">
        <span class="material-symbols-outlined text-text-light dark:text-text-dark text-3xl">close</span>
    </a>
<h1 class="text-text-light dark:text-text-dark text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Create New Alert</h1>
<div class="w-10"></div> <!-- Spacer -->
</header>
<main class="flex-grow px-4 pt-6 pb-4">
<!-- Stock Ticker Input -->
<div class="mb-6">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal pb-2">Stock Ticker</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark focus:border-primary/50 h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-[15px] text-base font-normal leading-normal" placeholder="e.g., AAPL" value="AAPL"/>
<div class="text-text-secondary-light dark:text-text-secondary-dark flex border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark items-center justify-center px-4 rounded-r-lg border-l-0">
<span class="material-symbols-outlined">search</span>
</div>
</div>
</label>
</div>
<!-- Current Price Display -->
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal pb-6">Current Price: $194.58</p>
<!-- Condition Selector -->
<div class="mb-6">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal pb-2">Alert me when...</p>
<div class="flex h-12 flex-1 items-center justify-center rounded-lg bg-gray-200 dark:bg-surface-dark p-1.5">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-surface-light dark:has-[:checked]:bg-gray-700 has-[:checked]:shadow-sm has-[:checked]:text-text-light dark:has-[:checked]:text-text-dark text-text-secondary-light dark:text-text-secondary-dark text-sm font-semibold leading-normal transition-colors">
<span class="truncate">Price is Above</span>
<input checked="" class="invisible w-0" name="alert-condition" type="radio" value="Price is Above"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-surface-light dark:has-[:checked]:bg-gray-700 has-[:checked]:shadow-sm has-[:checked]:text-text-light dark:has-[:checked]:text-text-dark text-text-secondary-light dark:text-text-secondary-dark text-sm font-semibold leading-normal transition-colors">
<span class="truncate">Price is Below</span>
<input class="invisible w-0" name="alert-condition" type="radio" value="Price is Below"/>
</label>
</div>
<div class="flex h-12 flex-1 items-center justify-center rounded-lg bg-gray-200 dark:bg-surface-dark p-1.5 mt-2">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-surface-light dark:has-[:checked]:bg-gray-700 has-[:checked]:shadow-sm has-[:checked]:text-text-light dark:has-[:checked]:text-text-dark text-text-secondary-light dark:text-text-secondary-dark text-sm font-semibold leading-normal transition-colors">
<span class="truncate">Crosses Above</span>
<input class="invisible w-0" name="alert-condition" type="radio" value="Crosses Above"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-surface-light dark:has-[:checked]:bg-gray-700 has-[:checked]:shadow-sm has-[:checked]:text-text-light dark:has-[:checked]:text-text-dark text-text-secondary-light dark:text-text-secondary-dark text-sm font-semibold leading-normal transition-colors">
<span class="truncate">Crosses Below</span>
<input class="invisible w-0" name="alert-condition" type="radio" value="Crosses Below"/>
</label>
</div>
</div>
<!-- Target Price Input -->
<div class="mb-6">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal pb-2">Target Price</p>
<div class="relative flex w-full flex-1 items-center">
<span class="absolute left-4 text-text-secondary-light dark:text-text-secondary-dark">$</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark focus:border-primary/50 h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark pl-8 pr-4 text-base font-normal leading-normal" inputmode="decimal" placeholder="200.00" type="number" value=""/>
</div>
</label>
</div>
</main>
<!-- Primary Action Button -->
<footer class="p-4 pt-2 sticky bottom-0 bg-background-light dark:bg-background-dark">
    <a href="alerts.html" class="flex h-14 w-full items-center justify-center rounded-lg bg-primary text-white text-base font-bold leading-normal transition-colors hover:bg-primary/90 disabled:bg-gray-300 dark:disabled:bg-gray-600 disabled:text-gray-500 dark:disabled:text-gray-400">Create Alert</a>
</footer>
</div>
</div>
<script src="script.js"></script>
</body></html>
