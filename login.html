<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#00D1C5",
              "background-light": "#f6f7f8",
              "background-dark": "#121212",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex h-screen w-full flex-col items-center bg-background-light dark:bg-background-dark overflow-hidden">
<div class="flex h-full w-full max-w-md flex-col items-center justify-center p-6">
<!-- App Logo -->
<div class="flex items-center justify-center pb-8">
<span class="material-symbols-outlined text-primary text-5xl">trending_up</span>
</div>
<!-- Welcome Message -->
<div class="w-full text-center">
<h1 class="text-gray-900 dark:text-gray-50 tracking-light text-3xl font-bold leading-tight pb-2">Welcome Back</h1>
<p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-normal pb-8">Log in to your account to continue.</p>
</div>
<!-- Login Form -->
<div class="flex w-full flex-col gap-4">
<!-- Email Field -->
<label class="flex flex-col w-full">
<p class="text-gray-800 dark:text-gray-200 text-base font-medium leading-normal pb-2">Email</p>
<div class="relative flex w-full items-center">
<span class="material-symbols-outlined absolute left-4 text-gray-400 dark:text-gray-500">mail</span>
<input class="form-input flex w-full flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-100 dark:bg-gray-800/50 py-3 pl-12 pr-4 text-gray-900 dark:text-gray-100 placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:border-primary focus:ring-2 focus:ring-primary/30 text-base font-normal leading-normal" placeholder="Enter your email" type="email" value=""/>
</div>
</label>
<!-- Password Field -->
<label class="flex flex-col w-full">
<p class="text-gray-800 dark:text-gray-200 text-base font-medium leading-normal pb-2">Password</p>
<div class="relative flex w-full items-center">
<span class="material-symbols-outlined absolute left-4 text-gray-400 dark:text-gray-500">lock</span>
<input class="form-input flex w-full flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-100 dark:bg-gray-800/50 py-3 pl-12 pr-12 text-gray-900 dark:text-gray-100 placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:border-primary focus:ring-2 focus:ring-primary/30 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<button class="absolute right-0 flex h-full items-center justify-center px-4 text-gray-400 dark:text-gray-500 hover:text-primary">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</label>
<!-- Forgot Password Link -->
<div class="w-full text-right pt-1">
<a class="text-primary text-sm font-medium leading-normal underline" href="#">Forgot Password?</a>
</div>
</div>
<!-- Login and Biometric Buttons -->
<div class="flex w-full flex-col gap-4 pt-8">
    <a href="watchlist.html" class="flex h-14 w-full items-center justify-center rounded-lg bg-primary px-6 text-base font-bold text-gray-900 shadow-sm transition-all hover:bg-primary/90">
        Log In
    </a>
<div class="flex items-center gap-4">
<div class="h-px flex-grow bg-gray-200 dark:bg-gray-700"></div>
<p class="text-sm text-gray-500 dark:text-gray-400">or</p>
<div class="h-px flex-grow bg-gray-200 dark:bg-gray-700"></div>
</div>
<button class="flex h-14 w-full items-center justify-center rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent px-6 text-gray-900 dark:text-gray-100 transition-colors hover:bg-gray-100 dark:hover:bg-gray-800">
<span class="material-symbols-outlined text-2xl">face</span>
<span class="ml-2 font-medium">Log In with Face ID</span>
</button>
</div>
<!-- Sign Up Navigation -->
<div class="flex-grow"></div>
<div class="w-full pt-8 text-center">
<p class="text-gray-600 dark:text-gray-400 text-sm font-normal">
                    Don't have an account? <a class="font-bold text-primary" href="index.html">Sign Up</a>
</p>
</div>
</div>
</div>
<script src="script.js"></script>
</body></html>
